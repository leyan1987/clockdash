apply plugin: 'com.android.application'

android {
    namespace 'com.clockdash'
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.clockdash'
        minSdkVersion 15      // Android 4.0.3 (RK2918 平板)
        targetSdkVersion 15   // 老系统保持老行为：精确闹钟、无后台限制
        versionCode 7         // 每次出包递增，便于在 设置→应用→时钟看板 里确认版本
        versionName '1.7'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 先用调试签名出包，方便直接安装；正式使用时可换成自己的签名
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 纯 Java 二维码库（生成 + 解码），无任何 Android 依赖
    implementation 'com.google.zxing:core:3.3.3'
}
